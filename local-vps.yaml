mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: true
prefer-ipv6: true
external-controller: '127.0.0.1:9090'
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
    geoip: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
    geosite: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
    mmdb: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
    asn: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb'
    metadb: 'https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb'
keep-alive-interval: 30
keep-alive-idle: 120
profile:
    store-selected: true
    store-fake-ip: true
sniffer:
    enable: true
    force-dns-mapping: true
    parse-pure-ip: true
    override-destination: true
    sniff: { HTTP: { ports: [80, 8080-8880], override-destination: true }, TLS: { ports: [443, 8443] }, QUIC: { ports: [443, 8443] } }
    skip-domain: ['Mijia Cloud', +.push.apple.com]
dns:
    enable: true
    prefer-h3: true
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    default-nameserver: [223.5.5.5, 119.29.29.29]
    nameserver: ['https://dns.cloudflare.com/dns-query', 'https://dns.google/dns-query']
    proxy-server-nameserver: ['https://dns.alidns.com/dns-query']
    nameserver-policy: { 'geosite:cn,geolocation-cn': ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query'] }
    fake-ip-filter: ['*.lan', '*.local', '*.direct', '*.localhost', 'time.*.com', 'ntp.*.com', 'time.*.gov', 'time.*.apple.com', time.windows.com, time.nist.gov, '*.msftconnecttest.com', '*.msftncsi.com', localhost.ptlogin2.qq.com, '*.cmpassport.com', '*.mcdn.bilivideo.cn', '*.battlenet.com.cn', +.wotgame.cn, +.wggames.cn, +.wowsgame.cn, id6.me, lens.l.google.com, captive.apple.com, connectivitycheck.gstatic.com]
# ======================
# 代理节点
# ======================
proxies:
  - name: '🇺🇸US vmRack-Reality_Vision'
    type: vless

# ======================
# 代理组
# ======================
proxy-groups:
  - name: 🚀节点选择
    type: select
    proxies:
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01
      - DIRECT
      
  - name: 📈🇭🇰券商
    type: select
    proxies:
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01
      - DIRECT

  - name: 🤖AI
    type: select
    proxies:
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01
      
  - name: 🌍国外流量
    type: select
    proxies:
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01
      

  - name: 💰金融直连
    type: select
    proxies:
      - DIRECT

  - name: 🍎Apple
    type: select
    proxies:
      - DIRECT
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01

  - name: 🚫屏蔽更新
    type: select
    proxies:
      - REJECT
      - DIRECT
      - 🇺🇸US vmRack-Reality_Vision
      - 🇺🇸US vmRack-TLS_Vision
      - 🇺🇸US RankNerd 01

  - name: 🧱广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT



